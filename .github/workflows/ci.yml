name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6  # 로컬 EIM과 같은 버전 (CLAUDE.md 참고)
          target: esp32s3
          path: firmware

  pi-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pi/requirements.txt
      - run: pytest
        working-directory: pi
      - run: pytest
        working-directory: agent

  receiver-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build receiver (raspberry pi 5 = arm64)
        uses: docker/build-push-action@v6
        with:
          context: pi
          platforms: linux/arm64
          push: false
