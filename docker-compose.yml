# 라즈베리파이 5에서 실행: mosquitto + receiver만 (mpv/오디오는 노트북 agent).
#   cp .env.example .env   # 값 채우기
#   docker compose up -d --build

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"   # SD 카드가 로그로 차지 않게
    max-file: "3"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"   # ESP32와 노트북 agent가 접속한다 (LAN 전용, 인터넷에 열지 말 것)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
    logging: *logging

  receiver:
    build: ./pi
    env_file: .env
    environment:
      MQTT_HOST: mosquitto
    depends_on:
      - mosquitto
    restart: unless-stopped
    logging: *logging
