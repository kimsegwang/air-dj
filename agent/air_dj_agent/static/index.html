<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>air-dj</title>
<style>
  :root { --bg:#0e1013; --card:#171a1f; --line:#262a31; --text:#e8eaed; --dim:#8b929c; --accent:#3ddc97; --warn:#f5a524; --bad:#f25f5c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Segoe UI","Malgun Gothic",sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:1px solid var(--line); }
  header h1 { font-size:20px; margin:0; letter-spacing:.5px; }
  .pills { display:flex; gap:8px; margin-left:auto; }
  .pill { font-size:12px; padding:4px 10px; border-radius:999px; background:var(--card); border:1px solid var(--line); color:var(--dim); }
  .pill::before { content:"●"; margin-right:6px; color:var(--bad); }
  .pill.on::before { color:var(--accent); }
  main { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr); gap:16px; padding:16px 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card h2 { font-size:12px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin:0 0 12px; }
  .col { display:flex; flex-direction:column; gap:16px; min-width:0; }

  #camwrap { position:relative; width:100%; aspect-ratio:4/3; background:#000; border-radius:8px; overflow:hidden; }
  #cam, #ov { position:absolute; inset:0; width:100%; height:100%; }
  #cam { object-fit:contain; visibility:hidden; }
  #cam.ok { visibility:visible; }
  #camwait { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); }
  #toast { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(.9); background:rgba(0,0,0,.7);
           padding:18px 28px; border-radius:16px; font-size:32px; font-weight:700; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; }
  #toast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #camfoot { display:flex; justify-content:space-between; color:var(--dim); font-size:12px; margin-top:8px; font-family:Consolas,monospace; }

  #gesture { display:flex; align-items:center; gap:16px; transition:opacity .2s; }
  #gesture.dim { opacity:.45; }
  #gvotes { font-size:13px; color:var(--dim); margin-top:2px; letter-spacing:2px; }
  #gvotes b { color:var(--accent); font-weight:400; }
  #gemoji { font-size:56px; width:72px; text-align:center; }
  #glabel { font-size:22px; font-weight:600; }
  #gmap { color:var(--accent); font-size:14px; margin-top:2px; min-height:18px; }
  .bars { flex:1; display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .bar { display:grid; grid-template-columns:44px 1fr 40px; align-items:center; gap:8px; font-size:12px; color:var(--dim); }
  .track { height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .fill { height:100%; width:0; background:var(--accent); transition:width .15s; }

  #title { font-size:22px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #artist { color:var(--dim); margin-top:4px; min-height:20px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #progress { margin-top:14px; }
  #times { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-top:4px; font-family:Consolas,monospace; }
  #playrow { display:flex; align-items:center; gap:14px; margin-top:12px; }
  #playstate { font-size:28px; width:36px; text-align:center; }
  #vol { flex:1; }
  #pos { color:var(--dim); font-size:13px; }
  #upcoming { list-style:none; padding:0; margin:12px 0 0; color:var(--dim); font-size:13px; }
  #upcoming li { padding:3px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #upcoming li::before { content:"↳ "; }

  #library { display:flex; align-items:center; gap:8px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); font-size:13px; }
  #mdir { flex:1; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 12px;
           font:inherit; cursor:pointer; white-space:nowrap; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:wait; }
  #libmsg { font-size:12px; color:var(--warn); min-height:16px; margin-top:6px; }

  #history { list-style:none; margin:0; padding:0; }
  #history li { display:grid; grid-template-columns:28px 1fr auto; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:14px; }
  #history li:last-child { border-bottom:none; }
  #history .ago { color:var(--dim); font-size:12px; }
  #history .fail { color:var(--bad); }
  .empty { color:var(--dim); font-size:13px; }

  #legend { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  #legend div { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; text-align:center; font-size:12px; color:var(--dim); }
  #legend div.active { border-color:var(--accent); color:var(--text); }
  #legend b { display:block; font-size:24px; margin-bottom:2px; }
</style>
</head>
<body>
<header>
  <h1>🎧 air-dj</h1>
  <div class="pills">
    <span class="pill" id="p-mqtt">브로커</span>
    <span class="pill" id="p-board">보드</span>
    <span class="pill" id="p-cam">카메라</span>
    <span class="pill" id="p-mpv">플레이어</span>
  </div>
</header>

<main>
  <div class="col">
    <section class="card">
      <h2>카메라 (ESP32)</h2>
      <div id="camwrap">
        <div id="camwait">카메라 연결 중…</div>
        <img id="cam" alt="">
        <canvas id="ov"></canvas>
        <div id="toast"></div>
      </div>
      <div id="camfoot"><span id="frame">-</span><span id="timing">-</span></div>
    </section>
  </div>

  <div class="col">
    <section class="card">
      <h2>지금 재생</h2>
      <div id="title">-</div>
      <div id="artist"></div>
      <div id="progress" class="track"><div class="fill" id="pfill"></div></div>
      <div id="times"><span id="tpos">0:00</span><span id="tdur">0:00</span></div>
      <div id="playrow">
        <div id="playstate">⏸</div>
        <div class="bar" id="vol"><span>볼륨</span><div class="track"><div class="fill" id="vfill"></div></div><span id="vtext">-</span></div>
        <div id="pos"></div>
      </div>
      <ul id="upcoming"></ul>
      <div id="library">
        <span>📁</span><span id="mdir">-</span>
        <button id="bchoose" title="노트북에 폴더 선택 창이 뜹니다">폴더 선택</button>
        <button id="breload" title="폴더에 곡을 추가/삭제한 뒤 다시 읽습니다 (처음 곡부터)">새로고침</button>
      </div>
      <div id="libmsg"></div>
    </section>

    <section class="card">
      <h2>인식 (보드 → 파이)</h2>
      <div id="gesture">
        <div id="gemoji">·</div>
        <div style="flex:1">
          <div id="glabel">대기 중</div>
          <div id="gmap"></div>
          <div id="gvotes" title="최근 5프레임 중 이 제스처가 나온 수. 3이면 명령이 나간다"></div>
          <div class="bars">
            <div class="bar"><span>분류</span><div class="track"><div class="fill" id="gscore"></div></div><span id="gscoret">-</span></div>
            <div class="bar"><span>검출</span><div class="track"><div class="fill" id="gdet"></div></div><span id="gdett">-</span></div>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>최근 명령</h2>
      <ul id="history"></ul>
    </section>

    <section class="card">
      <h2>제스처 안내</h2>
      <div id="legend"></div>
    </section>
  </div>
</main>

<script>
// pi/receiver/gestures.py DEFAULT_MAPPING과 맞춘다 (표시용)
const MAPPING = { ok:"play", five:"pause", one:"next", two:"prev", like:"volume_up", dislike:"volume_down" };
const CMD = { play:["▶","재생"], pause:["⏸","정지"], next:["⏭","다음 곡"], prev:["⏮","이전 곡"],
              volume_up:["🔊","볼륨 +"], volume_down:["🔉","볼륨 −"] };
const EMOJI = { ok:"👌", five:"✋", one:"☝️", two:"✌️", three:"🤟", four:"🖖", like:"👍", dislike:"👎",
                call:"🤙", no_gesture:"🤔", no_hand:"·" };
const $ = id => document.getElementById(id);

for (const [label, cmd] of Object.entries(MAPPING)) {
  const d = document.createElement("div");
  d.id = "lg-" + label;
  const b = document.createElement("b"); b.textContent = EMOJI[label];
  d.append(b, `${CMD[cmd][0]} ${CMD[cmd][1]}`);
  $("legend").append(d);
}

const fmt = s => (s == null || isNaN(s)) ? "0:00" : `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
const pill = (id, on) => $(id).classList.toggle("on", !!on);
const agoText = s => s < 60 ? `${Math.round(s)}초 전` : `${Math.round(s/60)}분 전`;

// 카메라: 보드 스트림 서버는 한 번에 한 접속만 받으므로 끊기면 다시 붙는다
let streamUrl = null, camOk = false;
const cam = $("cam");
cam.onload = () => { camOk = true; cam.classList.add("ok"); $("camwait").style.display = "none"; };
cam.onerror = () => { camOk = false; cam.classList.remove("ok"); $("camwait").style.display = "flex"; setTimeout(() => cam.src = streamUrl + "?t=" + Date.now(), 1500); };
function setStream(boardUrl) {
  if (!boardUrl || streamUrl) return;
  const u = new URL(boardUrl); u.port = "81"; u.pathname = "/stream";
  streamUrl = u.toString(); cam.src = streamUrl;
}

// 손 박스 오버레이
const ov = $("ov"), ctx = ov.getContext("2d");
async function tickBoard() {
  try {
    const r = await (await fetch("/api/board", { cache:"no-store" })).json();
    const w = ov.clientWidth, h = ov.clientHeight;
    if (ov.width !== w || ov.height !== h) { ov.width = w; ov.height = h; }
    ctx.clearRect(0, 0, w, h);
    if (r.w && camOk) {
      // object-fit: contain 영역 기준으로 좌표를 맞춘다
      const s = Math.min(w / r.w, h / r.h), ox = (w - r.w * s) / 2, oy = (h - r.h * s) / 2;
      ctx.lineWidth = 3; ctx.font = "600 18px Segoe UI, sans-serif";
      for (const hand of (r.hands || [])) {
        const [x1, y1, x2, y2] = hand.box;
        // 라벨은 프레임마다 바뀌는 원본 대신 인식 패널과 같은 평활화 결과를 쓴다
        ctx.strokeStyle = !shown ? "#8b929c" : MAPPING[shown] ? "#3ddc97" : "#f5a524";
        ctx.strokeRect(ox + x1*s, oy + y1*s, (x2-x1)*s, (y2-y1)*s);
        const t = shown ? `${EMOJI[shown] || ""} ${shown}` : "손";
        ctx.fillStyle = "rgba(0,0,0,.65)";
        ctx.fillRect(ox + x1*s, oy + y1*s - 26, ctx.measureText(t).width + 10, 26);
        ctx.fillStyle = ctx.strokeStyle; ctx.fillText(t, ox + x1*s + 5, oy + y1*s - 7);
      }
      $("frame").textContent = `frame ${r.frame}`;
      $("timing").textContent = r.ms ? `검출 ${r.ms.detect}ms · 전체 ${r.ms.loop}ms (${(1000/r.ms.loop).toFixed(1)} fps)` : "-";
    }
  } catch (e) {}
  setTimeout(tickBoard, 200);
}

let lastCmdAt;  // undefined = 아직 첫 응답 전
let shown = null;  // 평활화된 제스처 라벨 (카메라 박스에도 쓴다)
function toast(cmd) {
  const [icon, name] = CMD[cmd] || ["", cmd];
  $("toast").textContent = `${icon} ${name}`;
  $("toast").classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => $("toast").classList.remove("show"), 1200);
}

async function tickState() {
  try {
    const st = await (await fetch("/api/state", { cache:"no-store" })).json();
    setStream(st.board_url);
    const p = st.player, g = st.gesture, fresh = st.gesture_age != null && st.gesture_age < 2;
    pill("p-mqtt", st.mqtt); pill("p-board", fresh); pill("p-cam", camOk); pill("p-mpv", p.available);

    // 인식: 프레임마다가 아니라 최근 5프레임 기준 (agent state.smooth_gesture)
    const sm = fresh ? st.smoothed : { state:"none" };
    const label = sm.state === "gesture" ? sm.label : null;
    shown = label;
    $("gesture").classList.toggle("dim", sm.state !== "gesture");
    $("gemoji").textContent = label ? (EMOJI[label] || "✋") : sm.state === "hand" ? "✋" : "·";
    $("glabel").textContent = { gesture:label, hand:"손 인식됨", no_hand:"손 없음", none:"보드 신호 없음" }[sm.state];
    const cmd = label && MAPPING[label];
    $("gmap").textContent = cmd ? `→ ${CMD[cmd][0]} ${CMD[cmd][1]}` : "";
    const votes = cmd ? sm.votes : 0, win = sm.window || 5;
    $("gvotes").innerHTML = votes ? "<b>" + "●".repeat(votes) + "</b>" + "○".repeat(Math.max(win - votes, 0)) : "";
    const sc = label ? sm.score : 0, dt = sm.det || 0;
    $("gscore").style.width = `${sc*100}%`; $("gscoret").textContent = sc ? sc.toFixed(2) : "-";
    $("gdet").style.width = `${dt*100}%`; $("gdett").textContent = dt ? dt.toFixed(2) : "-";
    for (const l of Object.keys(MAPPING)) $("lg-" + l).classList.toggle("active", l === label);

    // 재생
    $("title").textContent = !p.available ? "플레이어 연결 안 됨"
      : p.title || (st.music_dir ? "폴더에 음악 파일이 없음" : "음악 폴더를 선택하세요");
    $("mdir").textContent = st.music_dir || "선택 안 됨";
    $("mdir").title = st.music_dir || "";
    $("artist").textContent = [p.artist, p.album].filter(Boolean).join(" · ");
    $("pfill").style.width = p.duration ? `${(p.position || 0) / p.duration * 100}%` : "0";
    $("tpos").textContent = fmt(p.position); $("tdur").textContent = fmt(p.duration);
    $("playstate").textContent = p.paused === false ? "▶" : "⏸";
    $("vfill").style.width = `${Math.min(p.volume || 0, 100)}%`;
    $("vtext").textContent = p.volume != null ? Math.round(p.volume) : "-";
    $("pos").textContent = p.index ? `${p.index} / ${p.count}` : "";
    $("upcoming").replaceChildren(...(p.upcoming || []).map(n => { const li = document.createElement("li"); li.textContent = n; return li; }));

    // 명령 기록
    const items = st.commands.map(c => {
      const li = document.createElement("li");
      const [icon, name] = CMD[c.command] || ["", c.command];
      const a = document.createElement("span"); a.textContent = icon;
      const b = document.createElement("span"); b.textContent = `${name}  ${EMOJI[c.label] || ""}`;
      if (!c.ok) { b.className = "fail"; b.textContent += " (실패)"; }
      const t = document.createElement("span"); t.className = "ago"; t.textContent = agoText(c.ago);
      li.append(a, b, t); return li;
    });
    if (!items.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = "아직 없음"; items.push(li); }
    $("history").replaceChildren(...items);
    // 페이지를 연 뒤 새로 들어온 명령만 화면에 띄운다
    const top = st.commands.length ? st.commands[0].at : null;
    if (lastCmdAt !== undefined && top !== null && top !== lastCmdAt) toast(st.commands[0].command);
    lastCmdAt = top;
  } catch (e) { pill("p-mpv", false); pill("p-mqtt", false); }
  setTimeout(tickState, 400);
}

// 음악 폴더: 선택 창은 브라우저가 아니라 노트북(agent)이 띄운다
async function libraryAction(path, busyText) {
  const buttons = [$("bchoose"), $("breload")];
  buttons.forEach(b => b.disabled = true);
  $("libmsg").textContent = busyText;
  try {
    const r = await (await fetch(path, { method:"POST" })).json();
    $("libmsg").textContent = r.ok ? "" : r.error;
  } catch (e) {
    $("libmsg").textContent = "agent에 연결할 수 없습니다";
  }
  buttons.forEach(b => b.disabled = false);
}
$("bchoose").onclick = () => libraryAction("/api/music/choose", "노트북 화면의 폴더 선택 창에서 고르세요…");
$("breload").onclick = () => libraryAction("/api/music/reload", "다시 읽는 중…");

tickBoard(); tickState();
</script>
</body>
</html>
